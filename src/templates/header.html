<header class="site-header">
  <div class="wrap header-inner">
    {{BRAND}}
    <div class="header-actions">
      <button
        class="theme-toggle"
        type="button"
        hidden
        data-theme-toggle
        aria-label="Activer le mode sombre"
        title="Activer le mode sombre"
      >
        {{THEME_MOON}} {{THEME_SUN}}
        <span class="theme-label" data-theme-label>Mode sombre</span>
      </button>
      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="navigation"
        aria-label="Ouvrir le menu"
      >
        <span></span><span></span>
      </button>
    </div>
    <nav class="navigation" id="navigation" aria-label="Navigation principale">
      <ul class="nav-links">
        <li><a href="{{PREFIX}}index.html#parcours">À propos</a></li>
        <li>
          <a href="{{PREFIX}}index.html#competences">Compétences</a>
        </li>
        <li>
          <a href="{{PREFIX}}projets.html" {{CURRENT_PROJECTS}}>Mes projets</a>
        </li>
        <li>
          <a href="{{PREFIX}}certification.html" {{CURRENT_CERTIFICATIONS}}
            >Certifications</a
          >
        </li>
        <li><a href="{{PREFIX}}index.html#agora">AGORA</a></li>
        <li>
          <a class="nav-contact" href="{{PREFIX}}index.html#contact"
            >Me contacter {{ICON_ARROW}}</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>
