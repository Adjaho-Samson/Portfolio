<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b1d21" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="robots" content="{{ROBOTS}}" />
    <meta name="author" content="Samson Adjaho" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="TchatzDev" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta
      property="og:image"
      content="{{ORIGIN}}/assets/images/partage-tchatzdev.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Samson Adjaho — TchatzDev, développeur web et Android"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta
      name="twitter:image"
      content="{{ORIGIN}}/assets/images/partage-tchatzdev.jpg"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/fonts/plus-jakarta-sans-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/inter-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="{{JS_THEME}}"></script>
    <link rel="stylesheet" href="{{CSS_PORTFOLIO}}" />
    <link rel="stylesheet" href="{{CSS_ORBITS}}" />
    <script type="application/ld+json">
      {{SCHEMA}}
    </script>
    <script src="{{JS_MAIN}}" defer></script>
  </head>
  <body data-page="{{PAGE_ID}}">
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    {{ICON_SPRITE}}
    {{HEADER}}
    <main id="contenu" tabindex="-1">{{CONTENT}}</main>
    {{FOOTER}}
  </body>
</html>
